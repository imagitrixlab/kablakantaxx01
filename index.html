<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ক্যাবলাকান্ত</title>
    <meta name="theme-color" content="#f4f6fa">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #f4f6fa;
            --silver-metal-border: rgba(203, 213, 225, 0.75);
            --electric-sky: #0ea5e9;
            --electric-sky-deep: #0284c7;
            --electric-cyan: #06b6d4;
            --electric-glow: rgba(14, 165, 233, 0.35);
            --emerald-core: #10b981;
            --emerald-deep: #047857;
            --emerald-glow: rgba(16, 185, 129, 0.38);
            --emerald-bg-start: rgba(236, 253, 245, 0.98);
            --emerald-bg-end: rgba(209, 250, 229, 0.92);
            --emerald-border: rgba(16, 185, 129, 0.45);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --radius-capsule: 9999px;
            --radius-bubble: 22px;
            --spring-transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #oceanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
        }

        .aura-header {
            position: relative;
            z-index: 50;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid var(--silver-metal-border);
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .brand-core {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .brand-orb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, var(--electric-sky) 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 2px 16px var(--electric-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s var(--spring-transition);
            flex-shrink: 0;
        }

        .brand-orb::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, var(--text-primary) 20%, var(--electric-sky-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 600;
            color: var(--electric-sky-deep);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .luxury-pill-toggle {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-capsule);
            font-size: 11.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .luxury-pill-toggle.active {
            background: #ffffff;
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
            box-shadow: 0 0 14px var(--electric-glow);
        }

        .chat-viewport {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 160px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .empty-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 16px;
            padding: 24px 12px;
        }

        .hero-title {
            font-size: 46px;
            font-weight: 900;
            background: linear-gradient(135deg, #0f172a 10%, #0284c7 45%, #0ea5e9 80%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        .typewriter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--silver-metal-border);
            padding: 9px 22px;
            border-radius: var(--radius-capsule);
        }

        .typewriter-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--electric-sky);
        }

        .typewriter-text {
            font-size: 13.8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .message-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            animation: floatSlideUp 0.38s var(--spring-transition) forwards;
        }

        @keyframes floatSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { align-items: flex-end; }
        .message-row.ai { align-items: flex-start; }

        .bubble-user {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            padding: 13px 20px;
            border-radius: 22px 22px 4px 22px;
            max-width: 85%;
            font-size: 14.8px;
            line-height: 1.55;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.28);
        }

        .user-preview-img {
            max-width: 220px;
            max-height: 200px;
            border-radius: 14px;
            margin-bottom: 6px;
            border: 2px solid #ffffff;
            object-fit: cover;
        }

        .bubble-ai {
            background: linear-gradient(135deg, var(--emerald-bg-start) 0%, var(--emerald-bg-end) 100%);
            border: 1.5px solid var(--emerald-border);
            color: #064e3b;
            padding: 18px 22px;
            border-radius: 22px 22px 22px 4px;
            max-width: 92%;
            font-size: 15px;
            line-height: 1.65;
            box-shadow: 0 8px 32px var(--emerald-glow);
            backdrop-filter: blur(22px);
        }

        .ai-header-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.25);
            font-size: 11.5px;
            font-weight: 800;
            color: var(--emerald-deep);
        }

        .gen-art-frame {
            width: 100%;
            max-width: 512px;
            border-radius: 16px;
            margin-top: 12px;
            border: 1.5px solid var(--emerald-border);
            display: block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .msg-action-tray {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        .action-chip-btn {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 11px;
            border-radius: var(--radius-capsule);
            transition: all 0.2s ease;
        }

        .action-chip-btn:hover {
            color: var(--emerald-deep);
            border-color: var(--emerald-core);
            background: #ffffff;
        }

        .dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 14px calc(14px + env(safe-area-inset-bottom)) 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .elastic-capsule {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            box-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.1);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            border: 1.5px solid var(--silver-metal-border);
            position: relative;
        }

        .attach-popup-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1.5px solid var(--silver-metal-border);
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            z-index: 200;
            min-width: 200px;
        }

        .attach-popup-menu.show { display: flex; }

        .attach-menu-btn {
            background: none;
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .attachment-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            background: #f1f5f9;
            border-radius: 14px;
            width: fit-content;
        }

        .attachment-thumb {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
        }

        .attachment-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .attachment-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            padding: 0 4px;
        }

        .dock-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dock-plus-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: var(--electric-sky-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dock-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .dock-btn.recording { color: #ef4444; background: rgba(239, 68, 68, 0.12); }

        .dock-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            padding: 8px 4px;
            max-height: 120px;
            resize: none;
            line-height: 1.5;
        }

        .dock-send-pill {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-sky) 0%, var(--electric-sky-deep) 100%);
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--electric-glow);
            flex-shrink: 0;
        }

        .dock-meta-tray {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px 2px 4px;
        }

        .mode-chip {
            background: none;
            border: none;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
        }

        .mode-chip.active {
            background: #ffffff;
            color: var(--electric-sky-deep);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .typing-wave {
            display: flex;
            gap: 5px;
            padding: 6px 0;
        }

        .wave-dot {
            width: 7px;
            height: 7px;
            background: var(--emerald-core);
            border-radius: 50%;
            animation: waveBounce 1.4s infinite ease-in-out;
        }
        .wave-dot:nth-child(1) { animation-delay: -0.32s; }
        .wave-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes waveBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="oceanCanvas"></canvas>

    <header class="aura-header">
        <div class="brand-core" onclick="location.reload()">
            <div class="brand-orb"></div>
            <div>
                <div class="brand-title">ক্যাবলাকান্ত</div>
                <div class="brand-sub">Cloudflare Worker Gateway Core</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="luxury-pill-toggle active" id="btnVoiceToggle" onclick="toggleVoiceEngine()">
                <span id="voiceIcon">🔊</span>
                <span id="voiceLabel">Voice Auto</span>
            </button>
        </div>
    </header>

    <main class="chat-viewport" id="chatViewport">
        <div class="empty-hero" id="emptyHero">
            <h1 class="hero-title">ক্যাবলাকান্ত</h1>
            <div class="typewriter-badge">
                <div class="typewriter-status-dot"></div>
                <span class="typewriter-text">বলো, আমি শুনছি...</span>
            </div>
        </div>
    </main>

    <div class="dock-container">
        <div class="elastic-capsule">
            
            <div class="attach-popup-menu" id="attachPopupMenu">
                <button type="button" class="attach-menu-btn" onclick="openDeviceCamera()">
                    <span>📷 ক্যামেরা দিয়ে স্ক্যান</span>
                </button>
                <button type="button" class="attach-menu-btn" onclick="openFileGallery()">
                    <span>🖼️ গ্যালারি / ফাইল আপলোড</span>
                </button>
            </div>

            <input type="file" id="directCameraInput" style="display:none;" accept="image/*" capture="environment" onchange="processIncomingImage(this)">
            <input type="file" id="galleryFileInput" style="display:none;" accept="image/*" onchange="processIncomingImage(this)">

            <div class="attachment-preview-bar" id="attachmentBar">
                <img id="attachmentThumb" class="attachment-thumb" src="" alt="preview">
                <span id="attachmentName" class="attachment-name">image.jpg</span>
                <span class="attachment-remove" onclick="clearAttachment()">✕</span>
            </div>

            <div class="dock-input-row">
                <button type="button" class="dock-plus-btn" id="dockPlusBtn" onclick="toggleAttachMenu()">
                    ＋
                </button>

                <textarea id="mainInputField" class="dock-input" rows="1" placeholder="Type a message or speak..." oninput="autoGrowInput(this)" onkeydown="checkSubmitKey(event)"></textarea>

                <button type="button" class="dock-btn" id="dockMicBtn" onclick="toggleGroqVoiceInput()">
                    🎤
                </button>

                <button type="button" class="dock-send-pill" onclick="sendUserMessage()">
                    ▲
                </button>
            </div>

            <div class="dock-meta-tray">
                <button class="mode-chip active" id="chipChat" onclick="setAppMode('chat')">💬 Chat & Scan</button>
                <button class="mode-chip" id="chipImage" onclick="setAppMode('image')">🎨 Imagen Studio</button>
            </div>
        </div>
    </div>

    <script>
        // আপনার লাইভ ক্লাউডফ্লেয়ার গেটওয়ে
        const WORKER_URL   = "https://kablakanta-api.agnidas505.workers.dev";
        const GROQ_API_KEY = "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";

        let currentAppMode = 'chat';
        let isVoiceReadoutActive = true;
        let lastUserPrompt = '';
        let selectedFileBase64 = null;
        let selectedFileMime = null;
        let selectedFileObject = null;

        function toggleVoiceEngine() {
            isVoiceReadoutActive = !isVoiceReadoutActive;
            const btn = document.getElementById('btnVoiceToggle');
            btn.classList.toggle('active', isVoiceReadoutActive);
            document.getElementById('voiceIcon').innerText = isVoiceReadoutActive ? "🔊" : "🔇";
            document.getElementById('voiceLabel').innerText = isVoiceReadoutActive ? "Voice Auto" : "Voice Off";
            if (!isVoiceReadoutActive && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function speakAiResponse(text) {
            if (!isVoiceReadoutActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let clean = text.replace(/<[^>]*>/g, ' ').replace(/```[\s\S]*?```/g, ' ').replace(/[`*#_]/g, ' ').slice(0, 320);
            if (!clean.trim()) return;

            const utter = new SpeechSynthesisUtterance(clean);
            utter.lang = /[\u0980-\u09FF]/.test(clean) ? 'bn-BD' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        function setAppMode(mode) {
            currentAppMode = mode;
            document.getElementById('chipChat').classList.toggle('active', mode === 'chat');
            document.getElementById('chipImage').classList.toggle('active', mode === 'image');
            document.getElementById('mainInputField').placeholder = mode === 'image' 
                ? "Describe visual in English (e.g. sports car, cyberpunk city)..." 
                : "Type a message, calculus query or speak...";
        }

        function autoGrowInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function checkSubmitKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserMessage();
            }
        }

        function toggleAttachMenu() {
            const menu = document.getElementById('attachPopupMenu');
            menu.classList.toggle('show');
        }

        function openDeviceCamera() {
            toggleAttachMenu();
            document.getElementById('directCameraInput').click();
        }

        function openFileGallery() {
            toggleAttachMenu();
            document.getElementById('galleryFileInput').click();
        }

        function processIncomingImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;

            selectedFileObject = file;
            selectedFileMime = file.type || 'image/jpeg';

            const reader = new FileReader();
            reader.onload = function(e) {
                const fullBase64 = e.target.result;
                selectedFileBase64 = fullBase64.split(',')[1];
                document.getElementById('attachmentThumb').src = fullBase64;
                document.getElementById('attachmentName').innerText = file.name.slice(0, 16);
                document.getElementById('attachmentBar').style.display = 'inline-flex';
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            selectedFileBase64 = null;
            selectedFileMime = null;
            selectedFileObject = null;
            document.getElementById('directCameraInput').value = '';
            document.getElementById('galleryFileInput').value = '';
            document.getElementById('attachmentBar').style.display = 'none';
        }

        let groqRecorder = null, audioChunks = [], isRecording = false;

        async function toggleGroqVoiceInput() {
            const micBtn = document.getElementById('dockMicBtn');
            if (isRecording) {
                if (groqRecorder && groqRecorder.state !== 'inactive') groqRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                groqRecorder = new MediaRecorder(stream);
                audioChunks = [];
                groqRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                groqRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice.webm');
                    formData.append('model', 'whisper-large-v3');

                    try {
                        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` },
                            body: formData
                        });
                        const data = await res.json();
                        if (data.text) {
                            const field = document.getElementById('mainInputField');
                            field.value = (field.value ? field.value + ' ' : '') + data.text.trim();
                            autoGrowInput(field);
                        }
                    } catch (_) {}
                };
                groqRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (_) {}
        }

        function appendUserMessage(text, imgSrc = null) {
            const hero = document.getElementById('emptyHero');
            if (hero) hero.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row user';

            let imgHtml = imgSrc ? `<img src="${imgSrc}" class="user-preview-img" alt="Scan">` : '';
            row.innerHTML = `
                ${imgHtml}
                <div class="bubble-user">${text}</div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function appendLoadingSkeleton(text = null) {
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'activeLoadingRow';
            row.innerHTML = `
                <div class="bubble-ai">
                    <div class="typing-wave">
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                    </div>
                    ${text ? `<div id="skeletonStatusText" style="font-size:12px; margin-top:6px; font-weight:600; color:var(--emerald-deep);">${text}</div>` : ''}
                </div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function updateLoadingText(text) {
            const el = document.getElementById('skeletonStatusText');
            if (el) el.innerText = text;
        }

        function appendAiMessage(text, artUrl = null) {
            const loading = document.getElementById('activeLoadingRow');
            if (loading) loading.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            const msgId = 'msg-' + Date.now();

            let artHtml = artUrl ? `<img src="${artUrl}" class="gen-art-frame" alt="AI Generated">` : '';
            row.innerHTML = `
                <div class="bubble-ai" id="${msgId}">
                    <div class="ai-header-badge"><span>ক্যাবলাকান্ত AI</span></div>
                    <div class="msg-content">${text}</div>
                    ${artHtml}
                </div>
                <div class="msg-action-tray">
                    <button class="action-chip-btn" onclick="copyMessageText('${msgId}')">📋 Copy</button>
                    <button class="action-chip-btn" onclick="retryMessagePrompt()">🔄 Retry</button>
                    <button class="action-chip-btn" onclick="readMessageAloud('${msgId}')">🔊 Listen</button>
                </div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });

            if (!artUrl) speakAiResponse(text);
        }

        function copyMessageText(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const content = el.querySelector('.msg-content')?.innerText || el.innerText;
            navigator.clipboard.writeText(content).then(() => alert("কপি করা হয়েছে!"));
        }

        function retryMessagePrompt() {
            if (!lastUserPrompt) return;
            const field = document.getElementById('mainInputField');
            field.value = lastUserPrompt;
            sendUserMessage();
        }

        function readMessageAloud(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const content = el.querySelector('.msg-content')?.innerText || el.innerText;
            speakAiResponse(content);
        }

        // ====================================================================
        // ক্লাউডফ্লেয়ার গেটওয়ে চ্যাট ইঞ্জিন (জিরো CORS ব্লক, জিরো ব্ল্যাঙ্ক বাবল)
        // ====================================================================
        async function executeGoogleGemini(text, fileBase64, fileMime) {
            try {
                const res = await fetch(`${WORKER_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text, fileBase64, fileMime })
                });

                if (res.ok) {
                    const data = await res.json();
                    appendAiMessage(data.reply.replace(/\n/g, '<br>'));
                } else {
                    appendAiMessage("নমস্কার! নেটওয়ার্কে সামান্য ধীরগতি দেখা দিয়েছে, দয়া করে আবার বলুন।");
                }
            } catch (_) {
                appendAiMessage("সার্ভারে সাময়িক সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        }

        // ====================================================================
        // ক্লাউডফ্লেয়ার হাগিং ফেস ইমেজ গেটওয়ে (ব্রাউজার ফ্রেন্ডলি)
        // ====================================================================
        async function executeImageEngine(promptText) {
            updateLoadingText("🎨 ক্লাউডফ্লেয়ার গেটওয়ে দিয়ে ছবি আঁকা হচ্ছে...");
            try {
                const res = await fetch(`${WORKER_URL}/image`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const imgSrc = URL.createObjectURL(blob);
                    appendAiMessage(`দৃশ্য তৈরি হয়েছে: "${promptText}"`, imgSrc);
                } else {
                    appendAiMessage("হাগিং ফেসের মডেলগুলো এই মুহূর্তে রিস্টার্ট হচ্ছে। অনুগ্রহ করে ১৫ সেকেন্ড পর আবার ট্রাই করুন।");
                }
            } catch (_) {
                appendAiMessage("ছবি রেন্ডার করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        }

        async function sendUserMessage() {
            const inputField = document.getElementById('mainInputField');
            const text = inputField.value.trim();
            const hasFile = !!selectedFileBase64;
            const currentFileBase64 = selectedFileBase64;
            const currentFileMime = selectedFileMime;
            const previewSrc = selectedFileObject ? URL.createObjectURL(selectedFileObject) : null;

            if (!text && !hasFile) return;

            lastUserPrompt = text;
            inputField.value = '';
            inputField.style.height = 'auto';
            clearAttachment();

            appendUserMessage(text || "ছবিটি স্ক্যান করুন...", previewSrc);

            const commonChatGreetings = ['hello', 'helloo', 'hi', 'hey', 'kno', 'keno', 'কেন', 'কেমন আছো', 'বলো'];
            const isJustGreeting = commonChatGreetings.includes(text.toLowerCase().trim());

            if (currentAppMode === 'image' && !isJustGreeting && !hasFile) {
                appendLoadingSkeleton("🎨 ইমেজ প্রস্তুত হচ্ছে...");
                await executeImageEngine(text);
            } else {
                appendLoadingSkeleton();
                if (currentAppMode === 'image' && isJustGreeting) setAppMode('chat');
                await executeGoogleGemini(text, currentFileBase64, currentFileMime);
            }
        }
    </script>
</body>
</html>
