<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ক্যাবলাকান্ত</title>
    <meta name="theme-color" content="#f4f6fa">

    <!-- Puter.js Fallback Engine -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #f4f6fa;
            --silver-metal-border: #dbe2ea;
            --electric-sky: #0ea5e9;
            --electric-sky-deep: #0284c7;
            --electric-cyan: #06b6d4;
            --electric-glow: rgba(14, 165, 233, 0.30);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius-capsule: 9999px;
            --radius-bubble: 20px;
            --spring-transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #oceanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.9;
        }

        .water-ripple {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.75);
            background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, transparent 70%);
            transform: scale(0);
            pointer-events: none;
            z-index: 9999;
            animation: rippleAnim 0.75s ease-out forwards;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        /* 1. হেডার ডিজাইন: সাউন্ড ও ভয়েস অটো বাটনসহ মিনিমালিস্ট লুক */
        .aura-header {
            position: relative;
            z-index: 50;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--silver-metal-border);
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .brand-core {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .brand-orb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 40%, var(--electric-sky) 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 2px 14px var(--electric-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-orb::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
        }

        .brand-text-block {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, var(--text-primary) 20%, var(--electric-sky-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 600;
            color: var(--electric-sky-deep);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .luxury-pill-toggle {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: var(--radius-capsule);
            font-size: 11.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.25s var(--spring-transition);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            user-select: none;
        }

        .luxury-pill-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
        }

        .luxury-pill-toggle:active {
            transform: scale(0.94);
        }

        .luxury-pill-toggle.active {
            background: #ffffff;
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
            box-shadow: 0 0 12px var(--electric-glow);
        }

        /* 2. চ্যাট ভিউপোর্ট ও সেন্ট্রাল হিরো সেকশন */
        .chat-viewport {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 150px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 840px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .empty-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 14px;
            padding: 24px 12px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0f172a 15%, #0284c7 48%, #00ffaa 82%, #38bdf8 100%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 4.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 14px rgba(14, 165, 233, 0.2));
            user-select: none;
        }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ৩ডি নিউরাল ওর্ব */
        .hero-neural-orb {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px auto;
            cursor: pointer;
            transition: transform 0.4s var(--spring-transition);
        }

        .hero-neural-orb:hover { transform: scale(1.15) rotate(10deg); }
        .hero-neural-orb:active { transform: scale(0.95); }

        .orb-core-sphere {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #38bdf8 30%, #0284c7 72%, #0369a1 100%);
            box-shadow: 0 0 28px rgba(14, 165, 233, 0.65);
            animation: orbBreathe 2.8s infinite ease-in-out;
            z-index: 2;
        }

        .orb-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--electric-sky);
            border-bottom-color: var(--electric-cyan);
            animation: orbSpin 3.2s linear infinite;
        }

        .orb-ring-outer {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px dashed rgba(14, 165, 233, 0.45);
            animation: orbSpinRev 7.5s linear infinite;
        }

        @keyframes orbBreathe {
            0%, 100% { transform: scale(0.96); box-shadow: 0 0 18px rgba(14, 165, 233, 0.45); }
            50% { transform: scale(1.05); box-shadow: 0 0 34px rgba(14, 165, 233, 0.85); }
        }

        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbSpinRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        /* লাইভ সাইবার টাইপরাইটার */
        .typewriter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--silver-metal-border);
            padding: 9px 20px;
            border-radius: var(--radius-capsule);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            min-height: 40px;
        }

        .typewriter-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--electric-sky);
            box-shadow: 0 0 8px var(--electric-sky);
            animation: blinkDot 1.6s infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .typewriter-text {
            font-size: 13.8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--electric-sky);
            animation: blinkCursor 0.8s infinite;
        }

        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ৩. মেসেজ বাবলস ও অ্যাকশনস */
        .message-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            animation: fadeIn 0.25s ease forwards;
        }

        .message-row.user { align-items: flex-end; }
        .message-row.ai { align-items: flex-start; }

        .bubble-user {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px 20px 4px 20px;
            max-width: 85%;
            font-size: 14.5px;
            line-height: 1.5;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
        }

        .bubble-ai {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e2e8f0;
            color: var(--text-primary);
            padding: 15px 18px;
            border-radius: 20px 20px 20px 4px;
            max-width: 92%;
            font-size: 14.5px;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .bubble-ai.speaking-now {
            border-color: var(--electric-sky);
            box-shadow: 0 0 24px var(--electric-glow);
        }

        .gen-art-frame {
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            margin-top: 10px;
            border: 1px solid var(--silver-metal-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: block;
        }

        .typing-wave {
            display: flex;
            gap: 5px;
            padding: 6px 0;
        }

        .wave-dot {
            width: 7px;
            height: 7px;
            background: var(--electric-sky);
            border-radius: 50%;
            animation: waveBounce 1.4s infinite ease-in-out;
        }
        .wave-dot:nth-child(1) { animation-delay: -0.32s; }
        .wave-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes waveBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ৪. ফ্লোটিং ডক (নিচের কোনো অতিরিক্ত টেক্সট নেই) */
        .dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 14px calc(12px + env(safe-area-inset-bottom)) 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .elastic-capsule {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            border: 1.5px solid var(--silver-metal-border);
            transition: all 0.25s ease;
        }

        .elastic-capsule:focus-within {
            border-color: var(--electric-sky);
            box-shadow: 0 20px 48px var(--electric-glow);
        }

        .dock-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dock-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .dock-btn:hover { background: rgba(14, 165, 233, 0.08); color: var(--electric-sky-deep); }
        .dock-btn.recording { color: #ef4444; background: rgba(239, 68, 68, 0.12); }

        .dock-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            padding: 8px 4px;
            max-height: 120px;
            resize: none;
            line-height: 1.5;
        }

        .dock-send-pill {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-sky) 0%, var(--electric-sky-deep) 100%);
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--electric-glow);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .dock-send-pill:hover { transform: scale(1.08); }

        .dock-meta-tray {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 4px 2px 4px;
        }

        .mode-group {
            display: flex;
            gap: 6px;
        }

        .mode-chip {
            background: none;
            border: none;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-chip.active {
            background: #ffffff;
            color: var(--electric-sky-deep);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="oceanCanvas"></canvas>

    <!-- হেডার -->
    <header class="aura-header">
        <div class="brand-core" onclick="resetChatView()">
            <div class="brand-orb"></div>
            <div class="brand-text-block">
                <div class="brand-title">ক্যাবলাকান্ত</div>
                <div class="brand-sub">Fluid Intelligence Core</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="luxury-pill-toggle active" id="btnSoundToggle" onclick="toggleSoundEngine()" title="Sound FX">
                <span id="soundIcon">🔔</span>
                <span id="soundLabel">Sound</span>
            </button>

            <button class="luxury-pill-toggle active" id="btnVoiceToggle" onclick="toggleVoiceEngine()" title="Auto Voice Readout">
                <span id="voiceIcon">🔊</span>
                <span id="voiceLabel">Voice Auto</span>
            </button>
        </div>
    </header>

    <!-- সেন্ট্রাল স্ক্রিন (মাঝের ৩টি প্রম্পট পিন সম্পূর্ণ বাদ) -->
    <main class="chat-viewport" id="chatViewport">
        <div class="empty-hero" id="emptyHero">
            <h1 class="hero-title">ক্যাবলাকান্ত</h1>

            <div class="hero-neural-orb" onclick="pingNeuralOrb()" title="Neural Core Pulse">
                <div class="orb-ring-outer"></div>
                <div class="orb-ring"></div>
                <div class="orb-core-sphere"></div>
            </div>

            <div class="typewriter-badge">
                <div class="typewriter-status-dot"></div>
                <span class="typewriter-text" id="typewriterDynamicText"></span>
                <span class="typewriter-cursor"></span>
            </div>
        </div>
    </main>

    <!-- ইনপুট ডক -->
    <div class="dock-container">
        <div class="elastic-capsule">
            <div class="dock-input-row">
                <textarea id="mainInputField" class="dock-input" rows="1" placeholder="Type a message, calculus query or speak..." oninput="autoGrowInput(this)" onkeydown="checkSubmitKey(event)"></textarea>

                <button type="button" class="dock-btn" id="dockMicBtn" onclick="toggleGroqVoiceInput()" title="Groq Voice Input">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <button type="button" class="dock-send-pill" onclick="sendUserMessage()" title="Send">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>

            <div class="dock-meta-tray">
                <div class="mode-group">
                    <button class="mode-chip active" id="chipChat" onclick="setAppMode('chat')">💬 Chat & Scan</button>
                    <button class="mode-chip" id="chipImage" onclick="setAppMode('image')">🎨 Imagen 3 Studio</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Google AI Studio Key & Groq Key কনফিগারেশন
        const GEMINI_API_KEY = "AQ.Ab8RN6LMO7i7aqFgPUL8ZPG4tpZh8LWU9FV_-wy9O3aFW9EEPg";
        const GROQ_API_KEY   = "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";

        let currentAppMode = 'chat';
        let isSoundActive = true;
        let isVoiceReadoutActive = true;
        let audioCtxInstance = null;

        // সাউন্ড ইঞ্জিন
        function initAudioContext() {
            if (!audioCtxInstance) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) audioCtxInstance = new AudioClass();
            }
            if (audioCtxInstance && audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
        }

        function playDropletChirp() {
            if (!isSoundActive) return;
            initAudioContext();
            if (!audioCtxInstance) return;
            const now = audioCtxInstance.currentTime;
            const osc = audioCtxInstance.createOscillator();
            const gain = audioCtxInstance.createGain();
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1760, now + 0.06);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.connect(gain);
            gain.connect(audioCtxInstance.destination);
            osc.start(now);
            osc.stop(now + 0.06);
        }

        function playPing() {
            if (!isSoundActive) return;
            initAudioContext();
            if (!audioCtxInstance) return;
            const now = audioCtxInstance.currentTime;
            const osc = audioCtxInstance.createOscillator();
            const gain = audioCtxInstance.createGain();
            osc.frequency.setValueAtTime(1046.5, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtxInstance.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function toggleSoundEngine() {
            isSoundActive = !isSoundActive;
            const btn = document.getElementById('btnSoundToggle');
            const icn = document.getElementById('soundIcon');
            const lbl = document.getElementById('soundLabel');
            btn.classList.toggle('active', isSoundActive);
            icn.innerText = isSoundActive ? "🔔" : "🔕";
            lbl.innerText = isSoundActive ? "Sound" : "Muted";
            if (isSoundActive) playPing();
        }

        function toggleVoiceEngine() {
            isVoiceReadoutActive = !isVoiceReadoutActive;
            const btn = document.getElementById('btnVoiceToggle');
            const icn = document.getElementById('voiceIcon');
            const lbl = document.getElementById('voiceLabel');
            btn.classList.toggle('active', isVoiceReadoutActive);
            icn.innerText = isVoiceReadoutActive ? "🔊" : "🔇";
            lbl.innerText = isVoiceReadoutActive ? "Voice Auto" : "Voice Off";
            if (!isVoiceReadoutActive && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (isSoundActive) playPing();
        }

        function speakAiResponse(text, bubbleEl) {
            if (!isVoiceReadoutActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const cleanText = text
                .replace(/<[^>]*>/g, ' ')
                .replace(/```[\s\S]*?```/g, ' কোড ব্লক ')
                .replace(/[`*#_]/g, ' ')
                .slice(0, 320);

            if (!cleanText.trim()) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            const isBengali = /[\u0980-\u09FF]/.test(cleanText);
            utterance.lang = isBengali ? 'bn-BD' : 'en-US';
            utterance.rate = 1.05;

            if (bubbleEl) bubbleEl.classList.add('speaking-now');
            utterance.onend = () => { if (bubbleEl) bubbleEl.classList.remove('speaking-now'); };
            utterance.onerror = () => { if (bubbleEl) bubbleEl.classList.remove('speaking-now'); };

            window.speechSynthesis.speak(utterance);
        }

        // ওশেন ব্যাকগ্রাউন্ড
        (function initOceanWaves() {
            const canvas = document.getElementById('oceanCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, dpr, step = 0;
            function resize() {
                dpr = window.devicePixelRatio || 1;
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize);
            resize();
            function render() {
                ctx.clearRect(0, 0, w, h);
                step += 0.014;
                ctx.beginPath();
                ctx.moveTo(0, h);
                for (let x = 0; x <= w; x += 20) {
                    const y = Math.sin(x * 0.0035 + step) * 22 + (h - 90);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w, h);
                ctx.fillStyle = 'rgba(14, 165, 233, 0.05)';
                ctx.fill();
                requestAnimationFrame(render);
            }
            render();
        })();

        // ওয়াটার রিপল
        window.addEventListener('pointerdown', (e) => {
            initAudioContext();
            const rip = document.createElement('div');
            rip.className = 'water-ripple';
            const size = 60;
            rip.style.width = size + 'px';
            rip.style.height = size + 'px';
            rip.style.left = (e.clientX - size / 2) + 'px';
            rip.style.top = (e.clientY - size / 2) + 'px';
            document.body.appendChild(rip);
            setTimeout(() => rip.remove(), 750);
        });

        // লাইভ টাইপরাইটার
        const TYPEWRITER_PHRASES = [
            "বলো, আমি শুনছি...",
            "যেকোনো জটিল ক্যালকুলাস এক সেকেন্ডে সমাধান...",
            "মাইকে বাংলায় কথা বলো, সাথে সাথে লিখছি...",
            "৮K সিনেমাটিক দৃশ্য আঁকতে বলো..."
        ];
        let phraseIdx = 0, charIdx = 0, isDeleting = false;

        function runTypewriter() {
            const el = document.getElementById('typewriterDynamicText');
            if (!el) return;
            const current = TYPEWRITER_PHRASES[phraseIdx];
            if (isDeleting) {
                el.innerText = current.substring(0, charIdx - 1);
                charIdx--;
            } else {
                el.innerText = current.substring(0, charIdx + 1);
                charIdx++;
            }
            let speed = isDeleting ? 30 : 65;
            if (!isDeleting && charIdx === current.length) {
                speed = 2200;
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                phraseIdx = (phraseIdx + 1) % TYPEWRITER_PHRASES.length;
                speed = 450;
            }
            setTimeout(runTypewriter, speed);
        }
        runTypewriter();

        function pingNeuralOrb() {
            playPing();
            const el = document.getElementById('typewriterDynamicText');
            if (el) el.innerText = "ক্যাবলাকান্ত কোর সক্রিয় ও প্রস্তুত!";
        }

        function autoGrowInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function setAppMode(mode) {
            currentAppMode = mode;
            document.getElementById('chipChat').classList.toggle('active', mode === 'chat');
            document.getElementById('chipImage').classList.toggle('active', mode === 'image');
            const field = document.getElementById('mainInputField');
            field.placeholder = mode === 'image' 
                ? "Describe 8K photorealistic visual in detail..." 
                : "Type a message, calculus query or speak...";
        }

        function checkSubmitKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserMessage();
            }
        }

        function resetChatView() {
            location.reload();
        }

        // Groq Whisper ভয়েস ইনপুট
        let groqRecorder = null, audioChunks = [], isRecording = false;

        async function toggleGroqVoiceInput() {
            const micBtn = document.getElementById('dockMicBtn');
            if (isRecording) {
                if (groqRecorder && groqRecorder.state !== 'inactive') groqRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                groqRecorder = new MediaRecorder(stream);
                audioChunks = [];
                groqRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                groqRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice.webm');
                    formData.append('model', 'whisper-large-v3');

                    try {
                        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` },
                            body: formData
                        });
                        const data = await res.json();
                        if (data.text) {
                            const field = document.getElementById('mainInputField');
                            field.value = (field.value ? field.value + ' ' : '') + data.text.trim();
                            autoGrowInput(field);
                        }
                    } catch (_) {}
                };
                groqRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (_) {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (Speech) {
                    const rec = new Speech();
                    rec.lang = 'bn-BD';
                    rec.onresult = (e) => {
                        const field = document.getElementById('mainInputField');
                        field.value = (field.value ? field.value + ' ' : '') + e.results[0][0].transcript;
                        autoGrowInput(field);
                    };
                    rec.start();
                }
            }
        }

        function appendUserMessage(text) {
            const hero = document.getElementById('emptyHero');
            if (hero) hero.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `<div class="bubble-user">${text}</div>`;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function appendLoadingSkeleton() {
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'activeLoadingRow';
            row.innerHTML = `
                <div class="bubble-ai">
                    <div class="typing-wave">
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                    </div>
                </div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function appendAiMessage(text, artUrl = null) {
            const loading = document.getElementById('activeLoadingRow');
            if (loading) loading.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            let artHtml = artUrl ? `<img src="${artUrl}" class="gen-art-frame" alt="Generated Visual">` : '';
            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'bubble-ai';
            bubbleEl.innerHTML = `${text}${artHtml}`;
            row.appendChild(bubbleEl);
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
            playPing();

            if (!artUrl) {
                speakAiResponse(text, bubbleEl);
            }
        }

        // প্রধান মেসেজ হ্যান্ডলার (x-goog-api-key হেডার দ্বারা সুরক্ষিত)
        async function sendUserMessage() {
            const inputField = document.getElementById('mainInputField');
            const text = inputField.value.trim();
            if (!text) return;

            playDropletChirp();
            inputField.value = '';
            inputField.style.height = 'auto';

            appendUserMessage(text);
            appendLoadingSkeleton();

            try {
                if (currentAppMode === 'image') {
                    // ৮K ভিজ্যুয়াল জেনারেশন
                    const seed = Math.floor(Math.random() * 9999999);
                    const promptEnc = encodeURIComponent(`masterpiece, photorealistic 8k, raw cinematic lighting, ${text}`);
                    const imgUrl = `https://image.pollinations.ai/prompt/${promptEnc}?model=flux&width=1024&height=1024&nologo=true&seed=${seed}`;

                    const testImg = new Image();
                    testImg.src = imgUrl;
                    testImg.onload = () => appendAiMessage(`Generated 8K Visual for: "${text}"`, imgUrl);
                    testImg.onerror = () => appendAiMessage(`Generated 8K Visual for: "${text}"`, imgUrl);
                } else {
                    // Google AI Studio রিকোয়েস্ট (x-goog-api-key হেডার যুক্ত)
                    const payload = {
                        contents: [{
                            parts: [{
                                text: `You are Kablakanta (ক্যাবলাকান্ত), an elite, highly intelligent AI. Solve calculus equations clearly step-by-step. Respond accurately.\n\nUser Question: ${text}`
                            }]
                        }]
                    };

                    let reply = "";
                    let isGeminiSuccess = false;

                    const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
                    for (const model of models) {
                        try {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'x-goog-api-key': GEMINI_API_KEY
                                },
                                body: JSON.stringify(payload)
                            });

                            const data = await res.json();
                            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                                reply = data.candidates[0].content.parts[0].text;
                                isGeminiSuccess = true;
                                break;
                            }
                        } catch (_) {}
                    }

                    // ব্যাকআপ ফলব্যাক ইঞ্জিন
                    if (!isGeminiSuccess) {
                        try {
                            const pRes = await puter.ai.chat(text);
                            reply = typeof pRes === 'string' ? pRes : (pRes?.message?.content || "রেসপন্স তৈরি হয়েছে।");
                        } catch (_) {
                            reply = "সার্ভার সংযোগ সমস্যা। পুনরায় চেষ্টা করুন।";
                        }
                    }

                    appendAiMessage(reply.replace(/\n/g, '<br>'));
                }
            } catch (err) {
                appendAiMessage("রেসপন্স প্রসেসিং এরর। ক্লাউড গেটওয়ে পুনরায় চেষ্টা করছে...");
            }
        }
    </script>
</body>
