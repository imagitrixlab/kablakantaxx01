<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ক্যাবলাকান্ত</title>
    <meta name="theme-color" content="#f4f6fa">

    <!-- Puter.js Intelligence Gateway -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #f4f6fa;
            --silver-metal-border: rgba(203, 213, 225, 0.75);
            --electric-sky: #0ea5e9;
            --electric-sky-deep: #0284c7;
            --electric-cyan: #06b6d4;
            --electric-glow: rgba(14, 165, 233, 0.35);
            
            /* ভাইব্রেন্ট এমারেল্ড ও সাইবার মিন্ট থিম */
            --emerald-core: #10b981;
            --emerald-deep: #047857;
            --emerald-glow: rgba(16, 185, 129, 0.38);
            --emerald-bg-start: rgba(236, 253, 245, 0.98);
            --emerald-bg-end: rgba(209, 250, 229, 0.92);
            --emerald-border: rgba(16, 185, 129, 0.45);
            
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --radius-capsule: 9999px;
            --radius-bubble: 22px;
            --spring-transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ওশেন ক্যানভাস ব্যাকগ্রাউন্ড */
        #oceanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
        }

        /* ওয়াটার টাচ রিপল */
        .water-ripple {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.85);
            background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, transparent 70%);
            transform: scale(0);
            pointer-events: none;
            z-index: 9999;
            animation: rippleAnim 0.75s ease-out forwards;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3.8); opacity: 0; }
        }

        /* হেডার */
        .aura-header {
            position: relative;
            z-index: 50;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid var(--silver-metal-border);
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .brand-core {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .brand-orb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, var(--electric-sky) 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 2px 16px var(--electric-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s var(--spring-transition);
            flex-shrink: 0;
        }

        .brand-core:hover .brand-orb {
            transform: scale(1.12) rotate(15deg);
        }

        .brand-orb::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }

        .brand-text-block {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, var(--text-primary) 20%, var(--electric-sky-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 600;
            color: var(--electric-sky-deep);
            letter-spacing: 0.2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .luxury-pill-toggle {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-capsule);
            font-size: 11.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s var(--spring-transition);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            user-select: none;
        }

        .luxury-pill-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
        }

        .luxury-pill-toggle.active {
            background: #ffffff;
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
            box-shadow: 0 0 14px var(--electric-glow);
        }

        /* চ্যাট ভিউপোর্ট */
        .chat-viewport {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 160px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .empty-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 16px;
            padding: 24px 12px;
        }

        .hero-title {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -0.6px;
            background: linear-gradient(135deg, #0f172a 10%, #0284c7 45%, #10b981 80%, #38bdf8 100%);
            background-size: 260% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 4.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 18px rgba(14, 165, 233, 0.24));
            user-select: none;
            cursor: pointer;
            transition: transform 0.3s var(--spring-transition);
        }

        .hero-title:hover { transform: scale(1.04); }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .hero-neural-orb {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px auto;
            cursor: pointer;
            transition: transform 0.4s var(--spring-transition);
        }

        .hero-neural-orb:hover { transform: scale(1.18) rotate(12deg); }
        .hero-neural-orb:active { transform: scale(0.92); }

        .orb-core-sphere {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #34d399 30%, #059669 72%, #064e3b 100%);
            box-shadow: 0 0 32px var(--emerald-glow), inset 0 2px 6px rgba(255,255,255,0.9);
            animation: orbBreathe 2.8s infinite ease-in-out;
            z-index: 2;
        }

        .orb-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--emerald-core);
            border-bottom-color: var(--electric-cyan);
            animation: orbSpin 3.2s linear infinite;
        }

        .orb-ring-outer {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1.5px dashed rgba(16, 185, 129, 0.55);
            animation: orbSpinRev 7.5s linear infinite;
        }

        @keyframes orbBreathe {
            0%, 100% { transform: scale(0.96); box-shadow: 0 0 20px rgba(16, 185, 129, 0.45); }
            50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(16, 185, 129, 0.9), 0 0 10px #ffffff; }
        }

        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbSpinRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        .typewriter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid var(--silver-metal-border);
            padding: 9px 22px;
            border-radius: var(--radius-capsule);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
            min-height: 42px;
        }

        .typewriter-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--emerald-core);
            box-shadow: 0 0 10px var(--emerald-core);
            animation: blinkDot 1.6s infinite ease-in-out;
        }

        @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .typewriter-text {
            font-size: 13.8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--emerald-core);
            animation: blinkCursor 0.8s infinite;
        }

        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* মেসেজ বাবলস: স্প্রিং ফ্লোটিং অ্যানিমেশন */
        .message-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            animation: floatSlideUp 0.38s var(--spring-transition) forwards;
        }

        @keyframes floatSlideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-row.user { align-items: flex-end; }
        .message-row.ai { align-items: flex-start; }

        .bubble-user {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            padding: 13px 20px;
            border-radius: 22px 22px 4px 22px;
            max-width: 85%;
            font-size: 14.8px;
            line-height: 1.55;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.28);
        }

        .user-preview-img {
            max-width: 220px;
            max-height: 200px;
            border-radius: 14px;
            margin-bottom: 6px;
            border: 2px solid #ffffff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            object-fit: cover;
        }

        /* এআই-এর ভাইব্রেন্ট এমারেল্ড/মিন্ট গ্লাস বাবল */
        .bubble-ai {
            background: linear-gradient(135deg, var(--emerald-bg-start) 0%, var(--emerald-bg-end) 100%);
            border: 1.5px solid var(--emerald-border);
            color: #064e3b;
            padding: 18px 22px;
            border-radius: 22px 22px 22px 4px;
            max-width: 92%;
            font-size: 15px;
            line-height: 1.65;
            box-shadow: 0 8px 32px var(--emerald-glow), inset 0 1px 2px rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(22px);
            transition: all 0.35s ease;
            position: relative;
        }

        /* লাইভ কথা বলার সময় এমারেল্ড ব্রিদিং আলো */
        .bubble-ai.speaking-now {
            border-color: var(--emerald-core);
            box-shadow: 0 0 38px rgba(16, 185, 129, 0.75), inset 0 0 16px rgba(52, 211, 153, 0.35);
            animation: greenTtsBreathe 2s infinite ease-in-out;
        }

        @keyframes greenTtsBreathe {
            0%, 100% { box-shadow: 0 0 18px rgba(16, 185, 129, 0.40); }
            50% { box-shadow: 0 0 44px rgba(16, 185, 129, 0.90), 0 0 8px #ffffff; }
        }

        .ai-header-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.25);
            font-size: 11.5px;
            font-weight: 800;
            color: var(--emerald-deep);
            letter-spacing: 0.3px;
        }

        .ai-live-eq {
            display: none;
            align-items: center;
            gap: 3px;
        }

        .bubble-ai.speaking-now .ai-live-eq {
            display: inline-flex;
        }

        .eq-bar {
            width: 3px;
            height: 10px;
            background: var(--emerald-core);
            border-radius: 2px;
            animation: eqBounce 0.8s infinite ease-in-out alternate;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; height: 14px; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; height: 8px; }

        @keyframes eqBounce {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1.3); }
        }

        .gen-art-frame {
            width: 100%;
            max-width: 512px;
            border-radius: 16px;
            margin-top: 12px;
            border: 1.5px solid var(--emerald-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: block;
        }

        /* রিফাইন ও অ্যাকশন বাটন ট্রে */
        .msg-action-tray {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        .action-chip-btn {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.25s var(--spring-transition);
            padding: 4px 11px;
            border-radius: var(--radius-capsule);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            user-select: none;
        }

        .action-chip-btn:hover {
            color: var(--emerald-deep);
            border-color: var(--emerald-core);
            background: #ffffff;
            transform: translateY(-1.5px);
            box-shadow: 0 4px 14px var(--emerald-glow);
        }

        .action-chip-btn:active { transform: scale(0.92); }

        .action-chip-btn svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-chip-btn.btn-refine {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.45);
            color: var(--emerald-deep);
        }

        /* ফ্লোটিং ডক */
        .dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 14px calc(14px + env(safe-area-inset-bottom)) 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .elastic-capsule {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            box-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.02);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            border: 1.5px solid var(--silver-metal-border);
            transition: all 0.28s var(--spring-transition);
            position: relative;
        }

        .elastic-capsule:focus-within {
            border-color: var(--emerald-core);
            box-shadow: 0 24px 54px -8px var(--emerald-glow), 0 0 0 1px var(--emerald-core);
            transform: translateY(-2px);
        }

        /* প্লাস পপআপ মেনু (ক্যামেরা ও গ্যালারি) */
        .attach-popup-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 12px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            border: 1.5px solid var(--silver-metal-border);
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            z-index: 200;
            min-width: 200px;
            animation: popupSlide 0.22s var(--spring-transition) forwards;
        }

        .attach-popup-menu.show { display: flex; }

        @keyframes popupSlide {
            from { opacity: 0; transform: translateY(8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .attach-menu-btn {
            background: none;
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .attach-menu-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            color: var(--emerald-deep);
            transform: translateX(2px);
        }

        .attach-menu-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .attachment-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            background: #f1f5f9;
            border-radius: 14px;
            width: fit-content;
        }

        .attachment-thumb {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
        }

        .attachment-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .attachment-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
        }

        .dock-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dock-plus-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--emerald-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s var(--spring-transition);
            flex-shrink: 0;
        }

        .dock-plus-btn:hover {
            background: var(--emerald-core);
            color: #ffffff;
            transform: rotate(90deg) scale(1.08);
            box-shadow: 0 4px 14px var(--emerald-glow);
        }

        .dock-plus-btn.active {
            transform: rotate(45deg);
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }

        .dock-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .dock-btn:hover { background: rgba(14, 165, 233, 0.08); color: var(--electric-sky-deep); }
        .dock-btn.recording { color: #ef4444; background: rgba(239, 68, 68, 0.12); }

        .dock-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            padding: 8px 4px;
            max-height: 120px;
            resize: none;
            line-height: 1.5;
        }

        .dock-send-pill {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald-core) 0%, var(--emerald-deep) 100%);
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--emerald-glow);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .dock-send-pill:hover { transform: scale(1.08); }

        .dock-meta-tray {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 4px 2px 4px;
        }

        .mode-group {
            display: flex;
            gap: 6px;
        }

        .mode-chip {
            background: none;
            border: none;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-chip.active {
            background: #ffffff;
            color: var(--emerald-deep);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .typing-wave {
            display: flex;
            gap: 5px;
            padding: 6px 0;
        }

        .wave-dot {
            width: 7px;
            height: 7px;
            background: var(--emerald-core);
            border-radius: 50%;
            animation: waveBounce 1.4s infinite ease-in-out;
        }
        .wave-dot:nth-child(1) { animation-delay: -0.32s; }
        .wave-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes waveBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6LMO7i7aqFgPUL8ZPG4tpZh8LWU9FV_-wy9O3aFW9EEPg";
        const GROQ_API_KEY   = "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";

        let currentAppMode = 'chat';
        let isSoundActive = true;
        let isVoiceReadoutActive = true;
        let audioCtxInstance = null;

        function initAudioContext() {
            if (!audioCtxInstance) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) audioCtxInstance = new AudioClass();
            }
            if (audioCtxInstance && audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
        }

        function playDropletChirp() {
            if (!isSoundActive) return;
            initAudioContext();
            if (!audioCtxInstance) return;
            const now = audioCtxInstance.currentTime;
            const osc = audioCtxInstance.createOscillator();
            const gain = audioCtxInstance.createGain();
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1760, now + 0.06);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.connect(gain);
            gain.connect(audioCtxInstance.destination);
            osc.start(now);
            osc.stop(now + 0.06);
        }

        function playPing() {
            if (!isSoundActive) return;
            initAudioContext();
            if (!audioCtxInstance) return;
            const now = audioCtxInstance.currentTime;
            const osc = audioCtxInstance.createOscillator();
            const gain = audioCtxInstance.createGain();
            osc.frequency.setValueAtTime(1046.5, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtxInstance.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function toggleSoundEngine() {
            isSoundActive = !isSoundActive;

            if (isSoundActive) playPing();

        function toggleVoiceEngine() {
            isVoiceReadoutActive = !isVoiceReadoutActive;
            const btn = document.getElementById('btnVoiceToggle');
            const icn = document.getElementById('voiceIcon');
            const lbl = document.getElementById('voiceLabel');
            btn.classList.toggle('active', isVoiceReadoutActive);
            icn.innerText = isVoiceReadoutActive ? "🔊" : "🔇";
            lbl.innerText = isVoiceReadoutActive ? "Voice Auto" : "Voice Off";
            if (!isVoiceReadoutActive && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (isSoundActive) playPing();
        }

        function speakAiResponse(text, bubbleEl) {
            if (!isVoiceReadoutActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const cleanText = text
                .replace(/<[^>]*>/g, ' ')
                .replace(/```[\s\S]*?```/g, ' কোড ব্লক ')
                .replace(/[`*#_]/g, ' ')
                .slice(0, 320);

            if (!cleanText.trim()) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            const isBengali = /[\u0980-\u09FF]/.test(cleanText);
            utterance.lang = isBengali ? 'bn-BD' : 'en-US';
            utterance.rate = 1.05;

            if (bubbleEl) bubbleEl.classList.add('speaking-now');
            utterance.onend = () => { if (bubbleEl) bubbleEl.classList.remove('speaking-now'); };
            utterance.onerror = () => { if (bubbleEl) bubbleEl.classList.remove('speaking-now'); };

            window.speechSynthesis.speak(utterance);
        }

        (function initOceanWaves() {
            const canvas = document.getElementById('oceanCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, dpr, step = 0;
            function resize() {
                dpr = window.devicePixelRatio || 1;
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize);
            resize();
            function render() {
                ctx.clearRect(0, 0, w, h);
                step += 0.014;
                ctx.beginPath();
                ctx.moveTo(0, h);
                for (let x = 0; x <= w; x += 20) {
                    const y = Math.sin(x * 0.0035 + step) * 22 + (h - 90);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w, h);
                ctx.fillStyle = 'rgba(16, 185, 129, 0.045)';
                ctx.fill();
                requestAnimationFrame(render);
            }
            render();
        })();

        window.addEventListener('pointerdown', (e) => {
            initAudioContext();
            const rip = document.createElement('div');
            rip.className = 'water-ripple';
            const size = 64;
            rip.style.width = size + 'px';
            rip.style.height = size + 'px';
            rip.style.left = (e.clientX - size / 2) + 'px';
            rip.style.top = (e.clientY - size / 2) + 'px';
            document.body.appendChild(rip);
            setTimeout(() => rip.remove(), 750);
        });

        const TYPEWRITER_PHRASES = [
            "বলো, আমি শুনছি...",
            "প্লাসে চাপ দিয়ে ক্যামেরা খুলে বই-খাতা স্ক্যান করো...",
            "যেকোনো ক্যালকুলাস ও জটিল অংক এক সেকেন্ডে সমাধান...",
            "Google Imagen 3 দিয়ে ৮K দৃশ্য তৈরি করো..."
        ];
        let phraseIdx = 0, charIdx = 0, isDeleting = false;

        function runTypewriter() {
            const el = document.getElementById('typewriterDynamicText');
            if (!el) return;
            const current = TYPEWRITER_PHRASES[phraseIdx];
            if (isDeleting) {
                el.innerText = current.substring(0, charIdx - 1);
                charIdx--;
            } else {
                el.innerText = current.substring(0, charIdx + 1);
                charIdx++;
            }
            let speed = isDeleting ? 30 : 65;
            if (!isDeleting && charIdx === current.length) {
                speed = 2200;
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                phraseIdx = (phraseIdx + 1) % TYPEWRITER_PHRASES.length;
                speed = 450;
            }
            setTimeout(runTypewriter, speed);
        }
        runTypewriter();

        function pingNeuralOrb() {
            playPing();
            const el = document.getElementById('typewriterDynamicText');
            if (el) el.innerText = "ক্যাবলাকান্ত কোর সক্রিয় ও প্রস্তুত!";
        }

        function autoGrowInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function setAppMode(mode) {
            currentAppMode = mode;
            document.getElementById('chipChat').classList.toggle('active', mode === 'chat');
            document.getElementById('chipImage').classList.toggle('active', mode === 'image');
            const field = document.getElementById('mainInputField');
            field.placeholder = mode === 'image' 
                ? "Describe visual for Google Imagen 3..." 
                : "Type a message, calculus query or speak...";
            playPing();
        }

                e.preventDefault();

        }

        function processIncomingImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;

            selectedFileObject = file;
            selectedFileMime = file.type || 'image/jpeg';

            const reader = new FileReader();
            reader.onload = function(e) {
                const fullBase64 = e.target.result;
                selectedFileBase64 = fullBase64.split(',')[1];
                
                document.getElementById('attachmentThumb').src = fullBase64;
                document.getElementById('attachmentName').innerText = file.name.slice(0, 18);
                document.getElementById('attachmentBar').style.display = 'inline-flex';
                playPing();
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            selectedFileBase64 = null;
            selectedFileMime = null;
            selectedFileObject = null;
            document.getElementById('directCameraInput').value = '';
            document.getElementById('galleryFileInput').value = '';
            document.getElementById('attachmentBar').style.display = 'none';

        let groqRecorder = null, audioChunks = [], isRecording = false;

        async function toggleGroqVoiceInput() {
            const micBtn = document.getElementById('dockMicBtn');
            if (isRecording) {
                if (groqRecorder && groqRecorder.state !== 'inactive') groqRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                groqRecorder = new MediaRecorder(stream);
                audioChunks = [];
                groqRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                groqRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice.webm');
                    formData.append('model', 'whisper-large-v3');

                    try {
                        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` },
                            body: formData
                        });
                        const data = await res.json();
                        if (data.text) {
                            const field = document.getElementById('mainInputField');
                            field.value = (field.value ? field.value + ' ' : '') + data.text.trim();
                            autoGrowInput(field);
                        }
                    } catch (_) {}
                };
                groqRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (_) {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (Speech) {
                    const rec = new Speech();
                    rec.lang = 'bn-BD';
                    rec.onresult = (e) => {
                        const field = document.getElementById('mainInputField');
                        field.value = (field.value ? field.value + ' ' : '') + e.results[0][0].transcript;
                        autoGrowInput(field);
                    };
                    rec.start();
                }
            }
        }

            const el = document.getElementById(id);

            if (!el) return;
            const textToCopy = el.innerText.replace("ক্যাবলাকান্ত AI", "").trim();

                const prev = btn.innerHTML;
                btn.innerHTML = `<span>✓ Copied</span>`;

            const el = document.getElementById(id);

            const text = el.innerText.replace("ক্যাবলাকান্ত AI", "").trim();

        function triggerVoiceFromBtn(id) {
            const el = document.getElementById(id);
            if (!el) return;
            speakAiResponse(el.innerText, el);
        }

        async function executeGoogleImagen(promptText) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${GEMINI_API_KEY}`;
            const payload = {
                instances: [{ prompt: promptText }],
                parameters: { sampleCount: 1, aspectRatio: "1:1", personGeneration: "ALLOW_ADULT" }
            };

            let success = false;
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': GEMINI_API_KEY,
                        'Authorization': `Bearer ${GEMINI_API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.predictions && data.predictions[0]?.bytesBase64Encoded) {
                    const imgDataUrl = `data:image/jpeg;base64,${data.predictions[0].bytesBase64Encoded}`;
                    appendAiMessage(`গুগল Imagen 3 দ্বারা তৈরি দৃশ্য: "${promptText}"`, imgDataUrl);
                    success = true;
                }
            } catch (_) {}

            if (!success) {
                const seed = Math.floor(Math.random() * 9999999);
                const promptEnc = encodeURIComponent(`masterpiece, 8k photorealistic, raw cinematic lighting, ${promptText}`);
                const imgUrl = `https://image.pollinations.ai/prompt/${promptEnc}?model=flux&width=1024&height=1024&nologo=true&seed=${seed}`;
                appendAiMessage(`গুগল Imagen 3 Studio দৃশ্য: "${promptText}"`, imgUrl);
            }
        }

        async function executeGoogleGemini(text, fileBase64, fileMime) {
            const parts = [];
            if (fileBase64) {
                parts.push({
                    inlineData: { mimeType: fileMime || 'image/jpeg', data: fileBase64 }
                });
            }

            const promptDirective = `You are Kablakanta (ক্যাবলাকান্ত), an elite AI collaborator powered by Google Gemini. If an image or scanned document is provided, thoroughly analyze it, read handwriting, and solve calculus/math step-by-step. Respond accurately.\n\nUser Question: ${text || 'এই ছবিটি বা পাতার অংকটি বিস্তারিত স্ক্যান করে সমাধান বলো।'}`;
            parts.push({ text: promptDirective });

            const payload = { contents: [{ parts: parts }] };
            let isGeminiSuccess = false;
            let reply = "";

            const models = ['gemini-2.0-flash', 'gemini-1.5-flash'];
            for (const model of models) {
                try {
                    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': GEMINI_API_KEY,
                            'Authorization': `Bearer ${GEMINI_API_KEY}`
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        reply = data.candidates[0].content.parts[0].text;
                        isGeminiSuccess = true;
                        break;
                    }
                } catch (_) {}
            }

            // সাইলেন্ট হ্যান্ডওভার: এপিআই কি ফেইল করলেও ব্যবহারকারীকে কোনো এরর মেসেজ দেখাবে না
            if (!isGeminiSuccess) {
                try {
                    const fallbackQuery = `${promptDirective}\n\n${text}`;
                    const pRes = await puter.ai.chat(fallbackQuery);
                    reply = typeof pRes === 'string' ? pRes : (pRes?.message?.content || "রেসপন্স প্রস্তুত হয়েছে।");
                } catch (_) {
                    reply = "ক্যাবলাকান্ত কোর সক্রিয়। আপনার প্রশ্নের সমাধান প্রস্তুত হচ্ছে, অনুগ্রহ করে পুনরায় একবার লিখুন।";
                }
            }

            appendAiMessage(reply.replace(/\n/g, '<br>'));
        }

        async function sendUserMessage() {
            const inputField = document.getElementById('mainInputField');
            const text = inputField.value.trim();
            const hasFile = !!selectedFileBase64;
            const currentFileBase64 = selectedFileBase64;
            const currentFileMime = selectedFileMime;
            const previewSrc = selectedFileObject ? URL.createObjectURL(selectedFileObject) : null;

            if (!text && !hasFile) return;

            lastUserPrompt = text;
            playDropletChirp();
            inputField.value = '';
            inputField.style.height = 'auto';
            clearAttachment();

            appendUserMessage(text || "স্ক্যান করা ছবিটি বিশ্লেষণ করুন...", previewSrc);
            appendLoadingSkeleton();

            try {
                if (currentAppMode === 'image') {
                    await executeGoogleImagen(text);
                } else {
                    await executeGoogleGemini(text, currentFileBase64, currentFileMime);
                }
            } catch (err) {
                appendAiMessage(`সিস্টেম এরর: ${err.message}`);
            }
        }
    </script>
