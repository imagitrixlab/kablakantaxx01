<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ক্যাবলাকান্ত</title>
    <meta name="theme-color" content="#f4f6fa">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #f4f6fa;
            --silver-metal-border: rgba(203, 213, 225, 0.75);
            --electric-sky: #0ea5e9;
            --electric-sky-deep: #0284c7;
            --electric-cyan: #06b6d4;
            --electric-glow: rgba(14, 165, 233, 0.35);
            --emerald-core: #10b981;
            --emerald-deep: #047857;
            --emerald-glow: rgba(16, 185, 129, 0.38);
            --emerald-bg-start: rgba(236, 253, 245, 0.98);
            --emerald-bg-end: rgba(209, 250, 229, 0.92);
            --emerald-border: rgba(16, 185, 129, 0.45);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --radius-capsule: 9999px;
            --radius-bubble: 22px;
            --spring-transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #oceanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
        }

        .aura-header {
            position: relative;
            z-index: 50;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid var(--silver-metal-border);
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            gap: 8px;
        }

        .brand-core {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .brand-orb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, var(--electric-sky) 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 2px 14px var(--electric-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-orb::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--text-primary) 20%, var(--electric-sky-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--electric-sky-deep);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .luxury-pill-toggle {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            padding: 5px 11px;
            border-radius: var(--radius-capsule);
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .luxury-pill-toggle.active {
            background: #ffffff;
            border-color: var(--electric-sky);
            color: var(--electric-sky-deep);
            box-shadow: 0 0 12px var(--electric-glow);
        }

        .gender-pill {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid var(--emerald-border);
            color: var(--emerald-deep);
            font-weight: 700;
        }

        .chat-viewport {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 160px 14px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .empty-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 14px;
            padding: 24px 12px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #0f172a 10%, #0284c7 45%, #0ea5e9 80%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        .typewriter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--silver-metal-border);
            padding: 8px 18px;
            border-radius: var(--radius-capsule);
        }

        .typewriter-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--electric-sky);
        }

        .typewriter-text {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .message-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            animation: floatSlideUp 0.35s var(--spring-transition) forwards;
        }

        @keyframes floatSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { align-items: flex-end; }
        .message-row.ai { align-items: flex-start; }

        .bubble-user {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px 20px 4px 20px;
            max-width: 85%;
            font-size: 14.5px;
            line-height: 1.5;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.25);
        }

        .user-preview-img {
            max-width: 220px;
            max-height: 200px;
            border-radius: 14px;
            margin-bottom: 6px;
            border: 2px solid #ffffff;
            object-fit: cover;
        }

        .bubble-ai {
            background: linear-gradient(135deg, var(--emerald-bg-start) 0%, var(--emerald-bg-end) 100%);
            border: 1.5px solid var(--emerald-border);
            color: #064e3b;
            padding: 16px 20px;
            border-radius: 20px 20px 20px 4px;
            max-width: 92%;
            font-size: 15px;
            line-height: 1.65;
            box-shadow: 0 8px 30px var(--emerald-glow);
            backdrop-filter: blur(20px);
        }

        .ai-header-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.25);
            font-size: 11px;
            font-weight: 800;
            color: var(--emerald-deep);
        }

        .gen-art-frame {
            width: 100%;
            max-width: 512px;
            border-radius: 16px;
            margin-top: 12px;
            border: 1.5px solid var(--emerald-border);
            display: block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .msg-action-tray {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 5px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        .action-chip-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--silver-metal-border);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: var(--radius-capsule);
            transition: all 0.2s ease;
        }

        .action-chip-btn:hover {
            color: var(--emerald-deep);
            border-color: var(--emerald-core);
            background: #ffffff;
        }

        .dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 12px calc(12px + env(safe-area-inset-bottom)) 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .elastic-capsule {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(30px);
            border-radius: 28px;
            box-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.1);
            padding: 7px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            border: 1.5px solid var(--silver-metal-border);
            position: relative;
        }

        .attach-popup-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1.5px solid var(--silver-metal-border);
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            z-index: 200;
            min-width: 200px;
        }

        .attach-popup-menu.show { display: flex; }

        .attach-menu-btn {
            background: none;
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .attachment-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            background: #f1f5f9;
            border-radius: 14px;
            width: fit-content;
        }

        .attachment-thumb {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
        }

        .attachment-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .attachment-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            padding: 0 4px;
        }

        .dock-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dock-plus-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: var(--electric-sky-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 18px;
        }

        .dock-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            flex-shrink: 0;
            font-size: 17px;
        }

        .dock-btn.recording { color: #ef4444; background: rgba(239, 68, 68, 0.12); }

        .dock-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            padding: 6px 4px;
            max-height: 120px;
            resize: none;
            line-height: 1.5;
        }

        .dock-send-pill {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-sky) 0%, var(--electric-sky-deep) 100%);
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--electric-glow);
            flex-shrink: 0;
            font-size: 14px;
        }

        .dock-meta-tray {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px 2px 4px;
        }

        .mode-chip {
            background: none;
            border: none;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
        }

        .mode-chip.active {
            background: #ffffff;
            color: var(--electric-sky-deep);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .typing-wave {
            display: flex;
            gap: 5px;
            padding: 6px 0;
        }

        .wave-dot {
            width: 7px;
            height: 7px;
            background: var(--emerald-core);
            border-radius: 50%;
            animation: waveBounce 1.4s infinite ease-in-out;
        }
        .wave-dot:nth-child(1) { animation-delay: -0.32s; }
        .wave-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes waveBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="oceanCanvas"></canvas>

    <header class="aura-header">
        <div class="brand-core" onclick="location.reload()">
            <div class="brand-orb"></div>
            <div>
                <div class="brand-title">ক্যাবলাকান্ত</div>
                <div class="brand-sub">Kolkata AI Gateway Core</div>
            </div>
        </div>

        <div class="header-actions">
            <!-- ছেলে / মেয়ে ভয়েস পরিবর্তনের টগল বাটন -->
            <button class="luxury-pill-toggle gender-pill" id="btnVoiceGender" onclick="toggleVoiceGender()">
                <span id="genderIcon">👩</span>
                <span id="genderLabel">মেয়ে কণ্ঠ</span>
            </button>

            <!-- ভয়েস অটো অন/অফ বাটন -->
            <button class="luxury-pill-toggle active" id="btnVoiceToggle" onclick="toggleVoiceEngine()">
                <span id="voiceIcon">🔊</span>
                <span id="voiceLabel">Voice Auto</span>
            </button>
        </div>
    </header>

    <main class="chat-viewport" id="chatViewport">
        <div class="empty-hero" id="emptyHero">
            <h1 class="hero-title">ক্যাবলাকান্ত</h1>
            <div class="typewriter-badge">
                <div class="typewriter-status-dot"></div>
                <span class="typewriter-text">বলো, কীভাবে সাহায্য করতে পারি?</span>
            </div>
        </div>
    </main>

    <div class="dock-container">
        <div class="elastic-capsule">
            
            <div class="attach-popup-menu" id="attachPopupMenu">
                <button type="button" class="attach-menu-btn" onclick="openDeviceCamera()">
                    <span>📷 ক্যামেরা দিয়ে স্ক্যান</span>
                </button>
                <button type="button" class="attach-menu-btn" onclick="openFileGallery()">
                    <span>🖼️ গ্যালারি / ফাইল আপলোড</span>
                </button>
            </div>

            <input type="file" id="directCameraInput" style="display:none;" accept="image/*" capture="environment" onchange="processIncomingImage(this)">
            <input type="file" id="galleryFileInput" style="display:none;" accept="image/*" onchange="processIncomingImage(this)">

            <div class="attachment-preview-bar" id="attachmentBar">
                <img id="attachmentThumb" class="attachment-thumb" src="" alt="preview">
                <span id="attachmentName" class="attachment-name">image.jpg</span>
                <span class="attachment-remove" onclick="clearAttachment()">✕</span>
            </div>

            <div class="dock-input-row">
                <button type="button" class="dock-plus-btn" id="dockPlusBtn" onclick="toggleAttachMenu()">
                    ＋
                </button>

                <textarea id="mainInputField" class="dock-input" rows="1" placeholder="মেসেজ লিখুন বা মুখে বলুন..." oninput="autoGrowInput(this)" onkeydown="checkSubmitKey(event)"></textarea>

                <button type="button" class="dock-btn" id="dockMicBtn" onclick="toggleVoiceRecognition()">
                    🎤
                </button>

                <button type="button" class="dock-send-pill" onclick="sendUserMessage()">
                    ▲
                </button>
            </div>

            <div class="dock-meta-tray">
                <button class="mode-chip active" id="chipChat" onclick="setAppMode('chat')">💬 Chat & Scan</button>
                <button class="mode-chip" id="chipImage" onclick="setAppMode('image')">🎨 Imagen Studio</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_GATEWAY = "https://kablakanta-api.agnidas505.workers.dev";

        let currentAppMode = 'chat';
        let isVoiceReadoutActive = true;
        let voiceGender = 'female'; // 'female' বা 'male'
        let lastUserPrompt = '';
        let selectedFileBase64 = null;
        let selectedFileMime = null;
        let selectedFileObject = null;

        // ছেলে ও মেয়ে ভয়েস টগল এবং সাথে সাথে স্পিচ প্রিভিউ
        function toggleVoiceGender() {
            voiceGender = (voiceGender === 'female') ? 'male' : 'female';
            const icon = document.getElementById('genderIcon');
            const label = document.getElementById('genderLabel');

            if (voiceGender === 'female') {
                icon.innerText = "👩";
                label.innerText = "মেয়ে কণ্ঠ";
                speakAiResponse("মেয়ে কণ্ঠ চালু হলো।");
            } else {
                icon.innerText = "👨";
                label.innerText = "ছেলে কণ্ঠ";
                speakAiResponse("ছেলে কণ্ঠ চালু হলো।");
            }
        }

        function toggleVoiceEngine() {
            isVoiceReadoutActive = !isVoiceReadoutActive;
            const btn = document.getElementById('btnVoiceToggle');
            btn.classList.toggle('active', isVoiceReadoutActive);
            document.getElementById('voiceIcon').innerText = isVoiceReadoutActive ? "🔊" : "🔇";
            document.getElementById('voiceLabel').innerText = isVoiceReadoutActive ? "Voice Auto" : "Voice Off";
            if (!isVoiceReadoutActive && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // ছেলে ও মেয়ে কণ্ঠের স্পষ্ট পার্থক্যসহ ভয়েস স্পিচ
        function speakAiResponse(text) {
            if (!isVoiceReadoutActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let clean = text.replace(/<[^>]*>/g, ' ').replace(/```[\s\S]*?```/g, ' ').replace(/[`*#_]/g, ' ').slice(0, 320);
            if (!clean.trim()) return;

            const utter = new SpeechSynthesisUtterance(clean);
            const isBengali = /[\u0980-\u09FF]/.test(clean);
            utter.lang = isBengali ? 'bn-IN' : 'en-IN';

            const systemVoices = window.speechSynthesis.getVoices() || [];
            const bengaliVoices = systemVoices.filter(v => 
                (v.lang && (v.lang.toLowerCase().includes('bn-in') || v.lang.toLowerCase().includes('bn_in'))) ||
                (v.lang && v.lang.toLowerCase().includes('bn')) ||
                (v.name && v.name.toLowerCase().includes('bengali'))
            );

            if (voiceGender === 'female') {
                // মেয়ে কণ্ঠ: মিষ্টি ও চড়া পিচ
                utter.pitch = 1.35;
                utter.rate = 1.02;
                if (bengaliVoices.length > 0) utter.voice = bengaliVoices[0];
            } else {
                // ছেলে কণ্ঠ: ভারী ও গভীর পুরুষালি পিচ
                utter.pitch = 0.55;
                utter.rate = 0.88;
                const maleVoice = bengaliVoices.find(v => /male|man|bid|voice\s*2|২/i.test(v.name));
                if (maleVoice) {
                    utter.voice = maleVoice;
                } else if (bengaliVoices.length > 1) {
                    utter.voice = bengaliVoices[1];
                }
            }

            window.speechSynthesis.speak(utter);
        }

        function setAppMode(mode) {
            currentAppMode = mode;
            document.getElementById('chipChat').classList.toggle('active', mode === 'chat');
            document.getElementById('chipImage').classList.toggle('active', mode === 'image');
            document.getElementById('mainInputField').placeholder = mode === 'image' 
                ? "Describe detailed visual in English..." 
                : "মেসেজ লিখুন বা মুখে বলুন...";
        }

        function autoGrowInput(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function checkSubmitKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserMessage();
            }
        }

        function toggleAttachMenu() {
            const menu = document.getElementById('attachPopupMenu');
            menu.classList.toggle('show');
        }

        function openDeviceCamera() {
            toggleAttachMenu();
            document.getElementById('directCameraInput').click();
        }

        function openFileGallery() {
            toggleAttachMenu();
            document.getElementById('galleryFileInput').click();
        }

        // ক্যামেরা ছবির সাইজ ক্লায়েন্ট-সাইডেই কম্প্রেস করা
        function processIncomingImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;

            selectedFileObject = file;
            selectedFileMime = 'image/jpeg';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let maxDim = 1024;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

                    selectedFileBase64 = compressedDataUrl.split(',')[1];
                    document.getElementById('attachmentThumb').src = compressedDataUrl;
                    document.getElementById('attachmentName').innerText = file.name.slice(0, 16);
                    document.getElementById('attachmentBar').style.display = 'inline-flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            selectedFileBase64 = null;
            selectedFileMime = null;
            selectedFileObject = null;
            document.getElementById('directCameraInput').value = '';
            document.getElementById('galleryFileInput').value = '';
            document.getElementById('attachmentBar').style.display = 'none';
        }

        // ভয়েস ইনপুট (Speech to text)
        let recognition = null;
        let isRecognizing = false;

        function toggleVoiceRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('dockMicBtn');

            if (!SpeechRec) {
                alert("আপনার ব্রাউজারে ভয়েস স্পিচ ফিচার নেই। Chrome বা Edge ব্যবহার করুন।");
                return;
            }

            if (isRecognizing) {
                if (recognition) recognition.stop();
                isRecognizing = false;
                micBtn.classList.remove('recording');
                return;
            }

            recognition = new SpeechRec();
            recognition.lang = 'bn-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecognizing = true;
                micBtn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const field = document.getElementById('mainInputField');
                field.value = (field.value ? field.value + ' ' : '') + transcript;
                autoGrowInput(field);
            };

            recognition.onerror = () => {
                isRecognizing = false;
                micBtn.classList.remove('recording');
            };

            recognition.onend = () => {
                isRecognizing = false;
                micBtn.classList.remove('recording');
            };

            recognition.start();
        }

        function appendUserMessage(text, imgSrc = null) {
            const hero = document.getElementById('emptyHero');
            if (hero) hero.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row user';

            let imgHtml = imgSrc ? `<img src="${imgSrc}" class="user-preview-img" alt="Scan">` : '';
            row.innerHTML = `
                ${imgHtml}
                <div class="bubble-user">${text}</div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function appendLoadingSkeleton(text = null) {
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'activeLoadingRow';
            row.innerHTML = `
                <div class="bubble-ai">
                    <div class="typing-wave">
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                        <div class="wave-dot"></div>
                    </div>
                    ${text ? `<div id="skeletonStatusText" style="font-size:12px; margin-top:6px; font-weight:600; color:var(--emerald-deep);">${text}</div>` : ''}
                </div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });
        }

        function updateLoadingText(text) {
            const el = document.getElementById('skeletonStatusText');
            if (el) el.innerText = text;
        }

        function appendAiMessage(text, artUrl = null) {
            const loading = document.getElementById('activeLoadingRow');
            if (loading) loading.remove();
            const vp = document.getElementById('chatViewport');
            const row = document.createElement('div');
            row.className = 'message-row ai';
            const msgId = 'msg-' + Date.now();

            let artHtml = artUrl ? `<img src="${artUrl}" class="gen-art-frame" alt="AI Generated">` : '';
            row.innerHTML = `
                <div class="bubble-ai" id="${msgId}">
                    <div class="ai-header-badge"><span>ক্যাবলাকান্ত AI</span></div>
                    <div class="msg-content">${text}</div>
                    ${artHtml}
                </div>
                <div class="msg-action-tray">
                    <button class="action-chip-btn" onclick="copyMessageText('${msgId}')">📋 Copy</button>
                    <button class="action-chip-btn" onclick="retryMessagePrompt()">🔄 Retry</button>
                    <button class="action-chip-btn" onclick="readMessageAloud('${msgId}')">🔊 Listen</button>
                </div>
            `;
            vp.appendChild(row);
            vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' });

            if (!artUrl) speakAiResponse(text);
        }

        function copyMessageText(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const content = el.querySelector('.msg-content')?.innerText || el.innerText;
            navigator.clipboard.writeText(content).then(() => alert("কপি করা হয়েছে!"));
        }

        function retryMessagePrompt() {
            if (!lastUserPrompt) return;
            const field = document.getElementById('mainInputField');
            field.value = lastUserPrompt;
            sendUserMessage();
        }

        function readMessageAloud(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const content = el.querySelector('.msg-content')?.innerText || el.innerText;
            speakAiResponse(content);
        }

        async function executeGatewayChat(text, fileBase64, fileMime) {
            try {
                const res = await fetch(`${WORKER_GATEWAY}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text, fileBase64, fileMime })
                });

                if (res.ok) {
                    const data = await res.json();
                    appendAiMessage((data.reply || "").replace(/\n/g, '<br>'));
                } else {
                    appendAiMessage("সার্ভারে সাময়িক ধীরগতি হচ্ছে। অনুগ্রহ করে একটু পর আবার চেষ্টা করুন।");
                }
            } catch (err) {
                appendAiMessage("সংযোগ বিচ্ছিন্ন হয়েছে। দয়া করে আপনার নেটওয়ার্ক চেক করুন।");
            }
        }

        async function executeGatewayImage(promptText) {
            updateLoadingText("🎨 ক্লাউডফ্লেয়ার জিপিইউ দিয়ে দৃশ্য আঁকা হচ্ছে...");
            try {
                const res = await fetch(`${WORKER_GATEWAY}/image`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const imgSrc = URL.createObjectURL(blob);
                    appendAiMessage(`দৃশ্য তৈরি হয়েছে: "${promptText}"`, imgSrc);
                } else {
                    appendAiMessage("ইমেজ রেন্ডার করতে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।");
                }
            } catch (err) {
                appendAiMessage("ছবি তৈরি করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        }

        async function sendUserMessage() {
            const inputField = document.getElementById('mainInputField');
            const text = inputField.value.trim();
            const hasFile = !!selectedFileBase64;
            const currentFileBase64 = selectedFileBase64;
            const currentFileMime = selectedFileMime;
            const previewSrc = selectedFileBase64 ? ('data:' + currentFileMime + ';base64,' + currentFileBase64) : null;

            if (!text && !hasFile) return;

            lastUserPrompt = text;
            inputField.value = '';
            inputField.style.height = 'auto';
            clearAttachment();

            appendUserMessage(text || "ছবিটি স্ক্যান করুন...", previewSrc);

            const commonChatGreetings = ['hello', 'hi', 'hey', 'kno', 'keno', 'কেন', 'কেমন আছো', 'বলো'];
            const isJustGreeting = commonChatGreetings.includes(text.toLowerCase().trim());

            if (currentAppMode === 'image' && !isJustGreeting && !hasFile) {
                appendLoadingSkeleton("🎨 দৃশ্য আঁকা হচ্ছে...");
                await executeGatewayImage(text);
            } else {
                appendLoadingSkeleton(hasFile ? "🔍 ছবিটি স্ক্যান করে তথ্য পড়া হচ্ছে..." : null);
                if (currentAppMode === 'image' && isJustGreeting) setAppMode('chat');
                await executeGatewayChat(text, currentFileBase64, currentFileMime);
            }
        }
    </script>
